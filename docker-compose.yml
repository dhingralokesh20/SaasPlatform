services:
  postgres:
    image: postgres:16
    container_name: worksphere-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worksphere

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - worksphere-network
  redis:
    image: redis:7
    container_name: worksphere-redis

    ports:
      - "6379:6379"
    networks:
      - worksphere-network
  nginx:
    image: nginx:latest
    container_name: worksphere-nginx

    ports:
      - "80:80"

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      identity-service:
        condition: service_started
      workspace-service:
        condition: service_started
      ui:
        condition: service_started
    
    networks:
      - worksphere-network
  identity-service:
    build:
      context: .
      dockerfile: ./apps/identity-service/Dockerfile

    container_name: worksphere-identity

    ports:
      - "3001:3001"

    volumes:
      - ./apps/identity-service:/app/apps/identity-service
      - /app/apps/identity-service/node_modules

    working_dir: /app/apps/identity-service

    command: npm run dev

    depends_on:
      postgres:
        condition: service_started

      redis:
        condition: service_started

      kafka-1:
        condition: service_healthy

      kafka-2:
        condition: service_healthy

      kafka-3:
        condition: service_healthy
    networks:
      - worksphere-network
  workspace-service:
    build:
      context: .
      dockerfile: ./apps/workspace-service/Dockerfile

    container_name: worksphere-workspace

    ports:
      - "3002:3002"

    volumes:
      - ./apps/workspace-service:/app/apps/workspace-service
      - /app/apps/workspace-service/node_modules
      - ./packages/shared-contracts:/app/packages/shared-contracts


    working_dir: /app/apps/workspace-service

    command: npm run dev

    depends_on:
      - postgres
      - redis
    networks:
      - worksphere-network
  kafka-1:
    image: apache/kafka:latest
    container_name: worksphere-kafka-1

    ports:
      - "9092:9092"

    environment:

      KAFKA_CLUSTER_ID: xvqftecRSTKO3dDTxjENaw
      # Unique ID of this Kafka broker.
      # Every broker in the cluster must have a different ID.
      KAFKA_NODE_ID: 1


      # This node acts as:
      # 1. Broker -> stores partitions and handles producer/consumer requests
      # 2. Controller -> manages cluster metadata and leader elections
      KAFKA_PROCESS_ROLES: broker,controller


      # KRaft controller quorum.
      # Replaces ZooKeeper.
      #
      # Kafka needs majority of controllers alive for metadata operations.
      #
      # Example:
      # kafka-1 + kafka-2 alive = quorum available
      #
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093


      # Internal Kafka listeners.
      #
      # PLAINTEXT:
      #   Broker communication and client connections
      #
      # CONTROLLER:
      #   KRaft controller communication
      #
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093


      # Address exposed to other containers.
      #
      # Applications inside docker network should use:
      # kafka-1:9092
      #
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092


      # Defines which listener is used for KRaft controller communication.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER


      # How brokers communicate with each other.
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT



      # Internal Kafka topic storing consumer offsets.
      #
      # Replication factor 3 means:
      # offset data exists on all 3 brokers.
      #
      # If one broker dies, consumer progress is safe.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3



      # Kafka transaction metadata replication.
      #
      # Important for exactly-once semantics.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3



      # Minimum replicas required for transaction metadata.
      #
      # With value 2:
      # Leader + one follower must acknowledge.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2



      # Removes default delay before consumer group rebalancing.
      #
      # Useful for local development.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

    volumes:
      # Persistent Kafka data.
      #
      # Stores:
      # - topics
      # - partitions
      # - metadata
      - kafka1_data:/var/lib/kafka/data
    networks:
      - worksphere-network
  kafka-2:
    image: apache/kafka:latest
    container_name: worksphere-kafka-2

    ports:
      - "9094:9092"

    environment:
      KAFKA_CLUSTER_ID: xvqftecRSTKO3dDTxjENaw
      KAFKA_NODE_ID: 2

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - worksphere-network

  kafka-3:
    image: apache/kafka:latest
    container_name: worksphere-kafka-3

    ports:
      - "9095:9092"

    environment:
      KAFKA_CLUSTER_ID: xvqftecRSTKO3dDTxjENaw

      KAFKA_NODE_ID: 3

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - worksphere-network
  ui:
    build:
      context: .
      dockerfile: ./apps/ui/Dockerfile

    container_name: worksphere-frontend

    ports:
      - "4200:4200"

    volumes:
      - ./apps/ui:/app/apps/ui
      - /app/apps/ui/node_modules
      - angular_cache:/tmp/angular-cache

    working_dir: /app/apps/ui

    command: npm run dev
    networks:
      - worksphere-network
volumes:
  postgres_data:
  angular_cache:
  kafka1_data:
  kafka2_data:
  kafka3_data:

networks:
  worksphere-network: