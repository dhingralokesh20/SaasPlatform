services:
  postgres:
    image: postgres:16
    container_name: worksphere-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d

    networks:
      - worksphere-network

  redis:
    image: redis:7
    container_name: worksphere-redis

    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - worksphere-network

  nginx:
    image: nginx:latest
    container_name: worksphere-nginx

    ports:
      - "80:80"

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      identity-service:
        condition: service_started
      workspace-service:
        condition: service_started
      notification-service:
        condition: service_started
      ui:
        condition: service_started

    networks:
      - worksphere-network

  identity-service:
    build:
      context: .
      dockerfile: ./apps/identity-service/Dockerfile

    container_name: worksphere-identity

    ports:
      - "${IDENTITY_PORT}:3001"
      - "${IDENTITY_DEBUG_PORT}:9229"

    volumes:
      - ./apps/identity-service:/app/apps/identity-service
      - /app/apps/identity-service/node_modules

    working_dir: /app/apps/identity-service

    environment:
      DEBUG_SERVICE: ${DEBUG_SERVICE:-}

    command: >
      sh -c 'if [ "$DEBUG_SERVICE" = "identity" ];
      then npm run dev:debug;
      else npm run dev;
      fi'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    networks:
      - worksphere-network

  workspace-service:
    build:
      context: .
      dockerfile: ./apps/workspace-service/Dockerfile

    container_name: worksphere-workspace

    environment:
      DEBUG_SERVICE: ${DEBUG_SERVICE:-}

    command: >
      sh -c 'if [ "$DEBUG_SERVICE" = "worskspace" ];
      then npm run dev:debug;
      else npm run dev;
      fi'

    ports:
      - "${WORKSPACE_PORT}:3002"
      - "${WORKSPACE_DEBUG_PORT}:9229"

    volumes:
      - ./apps/workspace-service:/app/apps/workspace-service
      - /app/apps/workspace-service/node_modules
      - ./packages/shared-contracts:/app/packages/shared-contracts

    working_dir: /app/apps/workspace-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    networks:
      - worksphere-network

  notification-service:
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile

    container_name: worksphere-notification

    ports:
      - "${NOTIFICATION_PORT}:3003"
      - "${NOTIFICATION_DEBUG_PORT}:9229"

    volumes:
      - ./apps/notification-service:/app/apps/notification-service
      - /app/apps/notification-service/node_modules
      - ./packages/shared-contracts:/app/packages/shared-contracts

    working_dir: /app/apps/notification-service

    environment:
      DEBUG_SERVICE: ${DEBUG_SERVICE:-}

    command: >
      sh -c 'if [ "$DEBUG_SERVICE" = "worskspace" ];
      then npm run dev:debug;
      else npm run dev;
      fi'

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

    networks:
      - worksphere-network

  kafka-1:
    image: apache/kafka:latest
    container_name: worksphere-kafka-1

    ports:
      - "${KAFKA_1_PORT}:9092"

    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

    volumes:
      - kafka1_data:/var/lib/kafka/data

    networks:
      - worksphere-network

  kafka-2:
    image: apache/kafka:latest
    container_name: worksphere-kafka-2

    ports:
      - "${KAFKA_2_PORT}:9092"

    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 2

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

    volumes:
      - kafka2_data:/var/lib/kafka/data

    networks:
      - worksphere-network

  kafka-3:
    image: apache/kafka:latest
    container_name: worksphere-kafka-3

    ports:
      - "${KAFKA_3_PORT}:9092"

    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 3

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

    volumes:
      - kafka3_data:/var/lib/kafka/data

    networks:
      - worksphere-network

  ui:
    build:
      context: .
      dockerfile: ./apps/ui/Dockerfile

    container_name: worksphere-frontend

    ports:
      - "${UI_PORT}:4200"

    volumes:
      - ./apps/ui:/app/apps/ui
      - /app/apps/ui/node_modules
      - angular_cache:/tmp/angular-cache

    working_dir: /app/apps/ui

    command: npm run dev

    networks:
      - worksphere-network

volumes:
  postgres_data:
  angular_cache:
  kafka1_data:
  kafka2_data:
  kafka3_data:

networks:
  worksphere-network:
