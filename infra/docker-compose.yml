version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: worksphere-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worksphere
    networks:
      - worksphere-net
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: worksphere-redis
    restart: always
    networks:
      - worksphere-net
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: worksphere-nginx
    restart: always
    networks:
      - worksphere-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

volumes:
  postgres_data:

networks:
  worksphere-net:
    external: true