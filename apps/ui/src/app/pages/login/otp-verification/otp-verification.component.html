<div class="otp-container" [class.shake]="isShaking">
  <div class="otp-stage-info">
    <button class="back-to-login" type="button" (click)="onBack()" [disabled]="loading || success">
      <span class="material-icons-outlined">arrow_back</span>
      Back to Sign In
    </button>
    <h2 class="otp-title">Verify your identity</h2>
    <p class="otp-subtitle">
      We've sent a 6-digit verification code to
      <span class="otp-email">{{ email }}</span>
    </p>
  </div>

  <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">
    <!-- 6 digit boxes -->
    <div class="otp-inputs-grid">
      <input 
        #otpInput
        *ngFor="let index of digits"
        type="text" 
        [formControlName]="'digit' + index"
        class="otp-box"
        [class.box-error]="errorType !== 'none'"
        [class.box-success]="success"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="1"
        autocomplete="one-time-code"
        (keydown)="onKeyDown($event, index)"
        (input)="onInput($event, index)"
        (paste)="onPaste($event)"
        [disabled]="loading || success"
      />
    </div>

    <!-- State Messages -->
    <div class="otp-status-container">
      <!-- Success State -->
      <div class="otp-success-message" *ngIf="success">
        <svg class="success-checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="success-checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
          <path class="success-checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Error Alerts -->
      <div class="otp-error-message" *ngIf="errorType !== 'none' && !success">
        <span class="material-icons-outlined error-icon">error_outline</span>
        <span>{{ getErrorMessage() }}</span>
      </div>
    </div>

    <!-- Actions Row -->
    <div class="otp-actions">
      <!-- Resend Code Button with Cooldown -->
      <button 
        class="resend-btn" 
        type="button" 
        (click)="onResend()" 
        [disabled]="resendDisabled || loading || success"
      >
        <span *ngIf="resendDisabled">Resend in {{ resendCooldown }}s</span>
        <span *ngIf="!resendDisabled">Resend Code</span>
      </button>

      <!-- Verify Code Primary CTA -->
      <button 
        class="verify-btn" 
        type="submit" 
        [disabled]="!isFormComplete() || loading || success"
      >
        <span class="btn-text" *ngIf="!loading && !success">Verify Code</span>
        <span class="btn-loading" *ngIf="loading">
          <mat-spinner diameter="18" color="accent"></mat-spinner>
          <span>Verifying...</span>
        </span>
      </button>
    </div>
  </form>

  <!-- Future Ready Support Area -->
  <div class="otp-future-ready">
    <div class="divider-thin"></div>
    <div class="future-options">
      <!-- Hidden/Reserved space where future MFA methods will reside (Authenticator App, Passkey, Backup Code) -->
      <span class="future-note">Try another verification method?</span>
      <div class="future-methods-list">
        <button class="method-btn" type="button" aria-label="Use Authenticator App" (click)="$event.preventDefault()">
          <span class="material-icons-outlined">phonelink_setup</span>
          Authenticator App
        </button>
        <button class="method-btn" type="button" aria-label="Use Backup Codes" (click)="$event.preventDefault()">
          <span class="material-icons-outlined">vpn_key</span>
          Backup Codes
        </button>
      </div>
    </div>
  </div>
</div>
